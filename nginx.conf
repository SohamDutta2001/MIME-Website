server {
    listen 80;
    server_name _;

    # The builder publishes each rebuild as a release-<ts> dir and flips the
    # `current` symlink to it. Serving through the symlink means a rebuild
    # swaps the whole site atomically.
    root /usr/share/nginx/html/current;
    index index.html;

    # Serve pre-compressed assets when available
    gzip_static on;

    # Aggressive caching for hashed static assets
    location ~* \.(js|css|woff2?|ttf|otf|eot|svg|ico|webp|avif|png|jpg|jpeg|gif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # No caching for HTML (always re-check)
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache";
    }

    # Fallback: serve index.html for any missing path (Astro static routing)
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }
}
